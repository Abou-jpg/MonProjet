name: Update Stats

on:
  schedule:
    # S'exécute automatiquement toutes les 30 minutes (à :15 et :45)
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Exécuter le script de scraping
        run: node scripts/update-stats.js

      - name: Enregistrer et publier les nouvelles stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Mise à jour automatique des stats [skip ci]" || echo "Aucune modification détectée"
          git push

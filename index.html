<script>
    lucide.createIcons();

    // 1. Thème Sombre / Clair
    const themeToggleBtn = document.getElementById('themeToggle');
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      lucide.createIcons();
    });

    // 2. Navigation principale (SPA)
    function navigateTab(tabName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));

      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.className = 'nav-tab text-zinc-600 dark:text-zinc-400 hover:text-emerald-600 dark:hover:text-white transition pb-0.5';
      });

      const targetView = document.getElementById(`view-${tabName}`);
      if (targetView) targetView.classList.remove('hidden');

      const activeBtn = document.getElementById(`nav-btn-${tabName}`);
      if (activeBtn) {
        activeBtn.className = 'nav-tab text-emerald-700 dark:text-emerald-400 font-semibold border-b-2 border-emerald-600 dark:border-emerald-400 pb-0.5';
      }

      if (tabName === 'gaming') {
        closeRLDetails();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    // 3. Navigation interne Gaming : Hub <-> Rocket League
    function openRLDetails() {
      document.getElementById('gaming-hub-screen').classList.add('hidden');
      document.getElementById('gaming-rl-screen').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeRLDetails() {
      document.getElementById('gaming-rl-screen').classList.add('hidden');
      document.getElementById('gaming-hub-screen').classList.remove('hidden');
      lucide.createIcons();
    }

    // 4. Accordéon Rocket League (1v1, 2v2, 3v3)
    function toggleAccordion(mode) {
      const content = document.getElementById(`content-${mode}`);
      const arrow = document.getElementById(`icon-arrow-${mode}`);
      const isOpen = content.classList.contains('open');

      ['1v1', '2v2', '3v3'].forEach(m => {
        const c = document.getElementById(`content-${m}`);
        const a = document.getElementById(`icon-arrow-${m}`);
        if (c) c.classList.remove('open');
        if (a) a.style.transform = 'rotate(0deg)';
      });

      if (!isOpen) {
        content.classList.add('open');
        arrow.style.transform = 'rotate(180deg)';
      }
    }

    // 5. Détection dynamique des badges
    function getRLRankBadge(rankStr) {
      if (!rankStr) return 'ou-1.jpg.png';
      const r = rankStr.toLowerCase();

      // Supersonic Legend
      if (r.includes('supersonic') || r.includes('ssl')) return 'ssl.webp.webp';

      // Grand Champion
      if (r.includes('grand champion iii') || r.includes('gc3') || r.includes('gc 3')) return 'gc-3.webp.webp';
      if (r.includes('grand champion ii') || r.includes('gc2') || r.includes('gc 2')) return 'gc-2.webp.webp';
      if (r.includes('grand champion') || r.includes('gc1') || r.includes('gc 1')) return 'gc-1.webp.webp';

      // Champion
      if (r.includes('champion iii') || r.includes('c3')) return 'champion-3.jpg.png';
      if (r.includes('champion ii') || r.includes('c2')) return 'champion-2.jpg.png';
      if (r.includes('champion i') || r.includes('c1')) return 'champion-1.jpg.png';

      // Diamant
      if (r.includes('diamond iii') || r.includes('diamant iii') || r.includes('d3')) return 'diamant-3.jpg.png';
      if (r.includes('diamond ii') || r.includes('diamant ii') || r.includes('d2')) return 'diamant-2.jpg.png';
      if (r.includes('diamond i') || r.includes('diamant i') || r.includes('d1')) return 'diamant-1.jpg.png';

      // Platine
      if (r.includes('platinum iii') || r.includes('platine iii') || r.includes('p3')) return 'platine-3.jpg.png';
      if (r.includes('platinum ii') || r.includes('platine ii') || r.includes('p2')) return 'platine-2.jpg.png';
      if (r.includes('platinum i') || r.includes('platine i') || r.includes('p1')) return 'platine-1.jpg.png';

      // Or / Gold (gestion de toutes les variantes de noms)
      if (r.includes('gold iii') || r.includes('or iii') || r.includes('gold 3') || r.includes('or 3') || r.includes('g3')) return 'ou-3.jpg.png';
      if (r.includes('gold ii') || r.includes('or ii') || r.includes('gold 2') || r.includes('or 2') || r.includes('g2')) return 'ou-2.jpg.png';
      if (r.includes('gold i') || r.includes('or i') || r.includes('gold 1') || r.includes('or 1') || r.includes('g1')) return 'ou-1.jpg.png';

      // Argent
      if (r.includes('silver iii') || r.includes('argent iii') || r.includes('argent 3')) return 'argent-3.jpg.png';
      if (r.includes('silver ii') || r.includes('argent ii') || r.includes('argent 2')) return 'argent-2.jpg.png';
      if (r.includes('silver i') || r.includes('argent i') || r.includes('argent 1')) return 'argent-1.jpg.png';

      // Bronze
      if (r.includes('bronze iii') || r.includes('bronze 3')) return 'bronze-3.jpg.png';
      if (r.includes('bronze ii') || r.includes('bronze 2')) return 'bronze-2.jpg.png';
      if (r.includes('bronze i') || r.includes('bronze 1')) return 'bronze-1.jpg.png';

      return 'platine-2.jpg.png';
    }

    // 6. Application avec fallback automatique si une image plante
    function applyBadgeWithFallback(imgElement, initialSrc) {
      if (!imgElement) return;

      const fallbackList = [
        initialSrc,
        initialSrc.replace('ou-', 'or-'),
        initialSrc.replace('.jpg.png', '.jpg'),
        initialSrc.replace('.jpg.png', '.png'),
        initialSrc.replace('ou-', 'gold-'),
        'platine-2.jpg.png'
      ];

      let attemptIndex = 0;

      imgElement.onerror = function() {
        attemptIndex++;
        if (attemptIndex < fallbackList.length) {
          this.src = fallbackList[attemptIndex];
        }
      };

      imgElement.src = fallbackList[0];
    }

    // 7. Chargement automatique des statistiques
    window.addEventListener('DOMContentLoaded', () => {
      fetch('./stats.json?t=' + Date.now())
        .then(response => {
          if (!response.ok) throw new Error("stats.json introuvable");
          return response.json();
        })
        .then(data => {
          if (data.rocketLeague) {
            const rl = data.rocketLeague;
            if (rl.duel1v1) {
              const el = document.getElementById('rl-1v1');
              const bd = document.getElementById('badge-1v1-compact');
              const img = document.getElementById('img-badge-1v1');
              if (el) el.innerText = rl.duel1v1;
              if (bd) bd.innerText = rl.duel1v1;
              applyBadgeWithFallback(img, getRLRankBadge(rl.duel1v1));
            }
            if (rl.doubles2v2) {
              const el = document.getElementById('rl-2v2');
              const bd = document.getElementById('badge-2v2-compact');
              const img = document.getElementById('img-badge-2v2');
              if (el) el.innerText = rl.doubles2v2;
              if (bd) bd.innerText = rl.doubles2v2;
              applyBadgeWithFallback(img, getRLRankBadge(rl.doubles2v2));
            }
            if (rl.standard3v3) {
              const el = document.getElementById('rl-3v3');
              const bd = document.getElementById('badge-3v3-compact');
              const img = document.getElementById('img-badge-3v3');
              if (el) el.innerText = rl.standard3v3;
              if (bd) bd.innerText = rl.standard3v3;
              applyBadgeWithFallback(img, getRLRankBadge(rl.standard3v3));
            }
          }

          if (data.valorant) {
            const v = data.valorant;
            const r = document.getElementById('valo-rank');
            const rr = document.getElementById('valo-rr');
            const kd = document.getElementById('valo-kd');
            const hs = document.getElementById('valo-hs');
            if (r && (v.rang || v.rank)) r.innerText = v.rang || v.rank;
            if (rr && v.rr) rr.innerText = `Score : ${v.rr} • Peak Silver 3`;
            if (kd && v.kd) kd.innerText = v.kd;
            if (hs && v.hs) hs.innerText = v.hs;
          }
        })
        .catch(err => console.error("Erreur stats :", err));
    });
  </script>

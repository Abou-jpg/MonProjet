name: Statistiques de jeu mises à jour automatiquement

on:
  schedule:
    - cron: '0 * * * *' # S'exécute automatiquement toutes les heures
  workflow_dispatch:      # Permet de le lancer manuellement à tout moment

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Exécuter le scraper
        run: node scripts/update-stats.js

      - name: Commit et Push des nouvelles stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des stats [skip ci]" && git push)
